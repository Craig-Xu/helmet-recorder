[project]
name = "helmet-recorder"
version = "0.1.0"
description = "多相机+IMU数据采集系统 - 无本体数据采集头盔"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kai" }
]

dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
viz = [
    "matplotlib>=3.8",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.scripts]
helmet-recorder = "helmet_recorder.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camera", "imu"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
